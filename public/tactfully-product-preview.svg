<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tactfully redesigned product dashboard</title>
  <desc id="desc">Visual concept for Tactfully: a calm forest-green and ivory client communication workspace with reply composer and conversation list.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#23392f" flood-opacity=".07"/></filter>
    <style>
      .ui{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.muted{fill:#89918a}.green{fill:#314a3f}.tiny{font-size:11px}.small{font-size:13px}.label{font-size:10px;font-weight:bold;letter-spacing:1.2px}.body{font-size:14px}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f5f6f2"/>

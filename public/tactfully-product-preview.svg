  <text x="301" y="666" class="ui" fill="#929892" font-size="9" font-weight="bold" letter-spacing="1.1">HOW SHOULD IT SOUND?</text>
  <rect x="301" y="678" width="70" height="28" rx="6" fill="#eef3ef" stroke="#9eb2a5"/><text x="336" y="696" text-anchor="middle" class="ui" fill="#52695b" font-size="9" font-weight="bold">✓ Warm</text><rect x="378" y="678" width="74" height="28" rx="6" fill="#fff" stroke="#e4e7e1"/><text x="415" y="696" text-anchor="middle" class="ui" fill="#7d837e" font-size="9">Direct</text><rect x="459" y="678" width="72" height="28" rx="6" fill="#fff" stroke="#e4e7e1"/><text x="495" y="696" text-anchor="middle" class="ui" fill="#7d837e" font-size="9">Candid</text><rect x="538" y="678" width="76" height="28" rx="6" fill="#fff" stroke="#e4e7e1"/><text x="576" y="696" text-anchor="middle" class="ui" fill="#7d837e" font-size="9">Formal</text>
  <rect x="301" y="730" width="487" height="42" rx="7" fill="#314a3f"/><text x="522" y="756" text-anchor="middle" class="ui" fill="#fff" font-size="11" font-weight="bold">✧  Create my response                              →</text>
  <!-- response panel -->
  <text x="844" y="425" class="ui" fill="#929892" font-size="10" font-weight="bold" letter-spacing="1.3">SUGGESTED RESPONSE</text><path d="M822 441h533" stroke="#edf0eb"/>
  <rect x="984" y="517" width="210" height="140" rx="8" fill="#f2f5ef" stroke="#cfdacf" transform="rotate(-6 1089 587)"/><rect x="1005" y="502" width="210" height="140" rx="8" fill="#edf2ec" stroke="#cfdacf" transform="rotate(5 1110 572)"/><rect x="1000" y="512" width="210" height="140" rx="8" fill="#fafbf7" stroke="#b5c5b7"/>
  <rect x="1020" y="533" width="68" height="6" rx="3" fill="#dce6dc"/><rect x="1020" y="550" width="166" height="5" rx="2.5" fill="#e8ede7"/><rect x="1020" y="565" width="147" height="5" rx="2.5" fill="#e8ede7"/><rect x="1020" y="580" width="159" height="5" rx="2.5" fill="#e8ede7"/>
  <text x="1088" y="689" text-anchor="middle" class="serif" fill="#4d5a52" font-size="17" font-weight="bold">A clearer response will appear here.</text>
  <text x="1088" y="713" text-anchor="middle" class="ui" fill="#969d97" font-size="10">Choose a situation and tone to prepare a thoughtful</text><text x="1088" y="729" text-anchor="middle" class="ui" fill="#969d97" font-size="10">starting point that still sounds like you.</text>

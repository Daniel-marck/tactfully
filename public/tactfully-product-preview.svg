  <rect x="14" y="158" width="207" height="39" rx="7" fill="#edf1eb"/><rect x="15" y="167" width="2" height="21" rx="1" fill="#718d7b"/><text x="31" y="183" class="ui green small" font-weight="bold">▦</text><text x="55" y="183" class="ui" fill="#35483e" font-size="13" font-weight="bold">Overview</text>
  <text x="31" y="226" class="ui" fill="#737973" font-size="15">✧</text><text x="55" y="226" class="ui" fill="#717771" font-size="13">New response</text><text x="180" y="226" class="ui muted tiny">⌘N</text>
  <text x="31" y="268" class="ui" fill="#737973" font-size="14">▤</text><text x="55" y="268" class="ui" fill="#717771" font-size="13">All drafts</text><text x="193" y="268" class="ui muted tiny">24</text>
  <text x="25" y="320" class="ui" fill="#a2a6a2" font-size="10" font-weight="bold" letter-spacing="1.3">COLLECTIONS</text>
  <circle cx="35" cy="350" r="4" fill="#d7a87b"/><text x="51" y="354" class="ui" fill="#737973" font-size="12">Scope &amp; pricing</text>
  <circle cx="35" cy="382" r="4" fill="#83a99d"/><text x="51" y="386" class="ui" fill="#737973" font-size="12">Following up</text>
  <circle cx="35" cy="414" r="4" fill="#9b91b5"/><text x="51" y="418" class="ui" fill="#737973" font-size="12">Client changes</text>
  <text x="30" y="453" class="ui" fill="#9a9f9a" font-size="15">＋</text><text x="51" y="453" class="ui" fill="#9a9f9a" font-size="12">New collection</text>
  <path d="M16 872h203" stroke="#e6e9e3"/><text x="31" y="905" class="ui" fill="#737973" font-size="13">⚙</text><text x="55" y="905" class="ui" fill="#717771" font-size="12">Settings</text>
  <text x="31" y="942" class="ui" fill="#737973" font-size="13">?</text><text x="55" y="942" class="ui" fill="#717771" font-size="12">Help &amp; feedback</text>

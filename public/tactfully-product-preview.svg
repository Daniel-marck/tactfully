  <rect x="235" y="0" width="1205" height="58" fill="#fafbf7"/><path d="M235 58h1205" stroke="#e7e9e5"/>
  <text x="275" y="35" class="ui muted" font-size="12">Workspace</text><text x="346" y="35" class="ui" fill="#c3c8c2" font-size="13">›</text><text x="364" y="35" class="ui" fill="#5d645f" font-size="12" font-weight="bold">Overview</text>
  <rect x="1110" y="13" width="175" height="32" rx="7" fill="#fff" stroke="#e2e5df"/><text x="1123" y="34" class="ui" fill="#9ba09c" font-size="12">⌕</text><text x="1144" y="33" class="ui" fill="#9ba09c" font-size="10">Search</text><text x="1246" y="33" class="ui" fill="#a8aca8" font-size="9">⌘ K</text>
  <rect x="1296" y="13" width="32" height="32" rx="7" fill="#fff" stroke="#e2e5df"/><text x="1312" y="34" text-anchor="middle" class="ui" fill="#7e8681" font-size="14">?</text><circle cx="1360" cy="29" r="16" fill="#dde8df"/><text x="1360" y="33" text-anchor="middle" class="ui" fill="#516157" font-size="9" font-weight="bold">JD</text>
  <!-- content -->
  <text x="280" y="105" class="ui" fill="#9a9f9b" font-size="10" font-weight="bold" letter-spacing="1.5">MONDAY, 21 NOVEMBER</text>
  <text x="280" y="151" class="serif" fill="#27352f" font-size="38" font-weight="bold">Good morning, Jordan.</text>
  <text x="280" y="177" class="ui" fill="#898e89" font-size="13">Here’s what’s happening across your client conversations.</text>
  <rect x="1190" y="122" width="165" height="42" rx="8" fill="#314a3f"/><text x="1210" y="149" class="ui" fill="#fff" font-size="17">＋</text><text x="1233" y="148" class="ui" fill="#fff" font-size="12" font-weight="bold">Write a response</text>
  <!-- metric cards -->
  <g filter="url(#shadow)"><rect x="280" y="204" width="345" height="91" rx="10" fill="#fff" stroke="#e3e7e1"/><rect x="639" y="204" width="345" height="91" rx="10" fill="#fff" stroke="#e3e7e1"/><rect x="998" y="204" width="357" height="91" rx="10" fill="#fff" stroke="#e3e7e1"/></g>
  <rect x="298" y="224" width="38" height="38" rx="9" fill="#edf4ef"/><text x="317" y="249" text-anchor="middle" class="ui" fill="#587969" font-size="17">✧</text><text x="350" y="237" class="ui muted" font-size="11">Responses written</text><text x="350" y="270" class="serif green" font-size="26" font-weight="bold">128</text><text x="545" y="267" class="ui" fill="#668172" font-size="10">↗ +14%</text><text x="583" y="267" class="ui muted" font-size="9">month</text>
  <rect x="657" y="224" width="38" height="38" rx="9" fill="#f4ede5"/><text x="676" y="248" text-anchor="middle" class="ui" fill="#9a744e" font-size="17">◷</text><text x="709" y="237" class="ui muted" font-size="11">Time saved</text><text x="709" y="270" class="serif green" font-size="26" font-weight="bold">6.4h</text><text x="864" y="267" class="ui" fill="#668172" font-size="10">↗ +22%</text><text x="902" y="267" class="ui muted" font-size="9">month</text>
  <rect x="1016" y="224" width="38" height="38" rx="9" fill="#eceaf2"/><text x="1035" y="248" text-anchor="middle" class="ui" fill="#77708e" font-size="16">✓</text><text x="1068" y="237" class="ui muted" font-size="11">Replies sent</text><text x="1068" y="270" class="serif green" font-size="26" font-weight="bold">92%</text><text x="1244" y="265" class="ui muted" font-size="9">of completed drafts</text>
  <!-- section title -->
  <text x="280" y="344" class="ui" fill="#9a9f9b" font-size="9" font-weight="bold" letter-spacing="1.5">YOUR RESPONSE DESK</text><text x="280" y="376" class="serif" fill="#303934" font-size="25" font-weight="bold">Turn a difficult message into the right words.</text><text x="1297" y="375" class="ui" fill="#7c8780" font-size="11">Clear →</text>
  <!-- composer cards -->
  <g filter="url(#shadow)"><rect x="280" y="395" width="529" height="407" rx="10" fill="#fff" stroke="#e1e5de"/><rect x="822" y="395" width="533" height="407" rx="10" fill="#fbfcf8" stroke="#e1e5de"/></g>
  <text x="301" y="425" class="ui" fill="#929892" font-size="10" font-weight="bold" letter-spacing="1.3">INCOMING MESSAGE</text><text x="783" y="425" class="ui" fill="#a1a69f" font-size="16">···</text>
  <circle cx="319" cy="463" r="18" fill="#eee4d8"/><text x="319" y="467" text-anchor="middle" class="serif" fill="#9a7357" font-size="10">AM</text><text x="347" y="459" class="ui" fill="#4e5752" font-size="11" font-weight="bold">Alex Morgan</text><text x="347" y="475" class="ui muted" font-size="9">alex@northstar.studio</text><text x="737" y="466" class="ui muted" font-size="9">Just now</text>
  <text x="301" y="510" class="serif" fill="#606963" font-size="14">Hey Jordan — quick question. Could we also add the</text><text x="301" y="531" class="serif" fill="#606963" font-size="14">landing page to the project? We’d really like to keep</text><text x="301" y="552" class="serif" fill="#606963" font-size="14">the original launch date if possible.</text>
  <path d="M301 572h487" stroke="#edf0ec"/>
  <text x="301" y="597" class="ui" fill="#929892" font-size="9" font-weight="bold" letter-spacing="1.1">WHAT ARE YOU RESPONDING TO?</text>

  <text x="280" y="845" class="ui" fill="#9a9f9b" font-size="9" font-weight="bold" letter-spacing="1.5">RECENTLY USED</text><text x="280" y="874" class="serif" fill="#303934" font-size="22" font-weight="bold">Continue a conversation</text><text x="1280" y="871" class="ui" fill="#66766d" font-size="11" font-weight="bold">View all →</text>
  <rect x="280" y="892" width="1075" height="89" rx="9" fill="#fff" stroke="#e2e6df"/><rect x="281" y="893" width="1073" height="28" rx="8" fill="#fafbf8"/><text x="301" y="912" class="ui" fill="#a2a7a2" font-size="8" font-weight="bold" letter-spacing="1">CONVERSATION</text><text x="832" y="912" class="ui" fill="#a2a7a2" font-size="8" font-weight="bold" letter-spacing="1">TONE</text><text x="980" y="912" class="ui" fill="#a2a7a2" font-size="8" font-weight="bold" letter-spacing="1">STATUS</text><text x="1160" y="912" class="ui" fill="#a2a7a2" font-size="8" font-weight="bold" letter-spacing="1">UPDATED</text>
  <circle cx="317" cy="951" r="15" fill="#eee7dc"/><text x="317" y="954" text-anchor="middle" class="serif" fill="#8a745d" font-size="8">AM</text><text x="343" y="947" class="ui" fill="#59625d" font-size="10" font-weight="bold">Alex Morgan</text><text x="343" y="962" class="ui" fill="#9ba19d" font-size="9">Could we also add the landing page?</text><text x="832" y="954" class="ui" fill="#8d948f" font-size="9">Warm</text><circle cx="982" cy="950" r="3" fill="#91a798"/><text x="991" y="954" class="ui" fill="#7f8982" font-size="9">New</text><text x="1160" y="954" class="ui" fill="#9ba19d" font-size="9">12m ago</text><text x="1328" y="954" class="ui" fill="#adb3af" font-size="15">›</text>

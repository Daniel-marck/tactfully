  <text x="65" y="45" class="serif green" font-size="22" font-weight="bold">Tactfully</text>
  <rect x="16" y="81" width="203" height="58" rx="9" fill="#fff" stroke="#e2e6df"/><rect x="27" y="93" width="34" height="34" rx="8" fill="#edf1eb"/><text x="44" y="116" text-anchor="middle" class="serif" fill="#53675d" font-size="17">J</text>
